version: 2

models:
  - name: dim_products
    description: "Dimensional model for product-level aggregated sales data."
    columns:
      - name: ProductID
        description: "Unique identifier for the product."
        tests:
          - not_null
          - unique
      - name: TotalQuantitySold
        description: "Total quantity of the product sold."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: TotalRevenue
        description: "Total revenue generated by the product."
        tests:
          - not_null
          - positive_values

  - name: dim_retailers
    description: "Dimensional model for retailer-level aggregated sales data."
    columns:
      - name: RetailerID
        description: "Unique identifier for the retailer."
        tests:
          - not_null
          - unique
      - name: RetailerName
        description: "Name of the retailer."
        tests:
          - not_null
      - name: Location
        description: "Location of the retailer."
        tests:
          - not_null
      - name: Channel
        description: "Sales channel used by the retailer."
        tests:
          - not_null

